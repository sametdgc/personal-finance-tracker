name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json declares packageManager, and
      # action-setup fails with "Multiple versions of pnpm specified" if both are
      # given. Letting it read package.json keeps CI, Corepack and Vercel on one
      # pinned version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Core purity boundary
        run: pnpm verify:purity

      - name: Unit tests
        run: pnpm test

      - name: Migration drift
        run: pnpm db:check
